<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today in History — Discover What Happened Today</title>
    <meta
      name="description"
      content="Explore historical events that happened today, filtered by your passions. Stunning AI-generated visuals every day."
    />
    <meta property="og:title" content="Today in History" />
    <meta
      property="og:description"
      content="Discover what happened today in history. Explore events by your passions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Today in History" />
    <meta name="twitter:description" content="Discover what happened today in history." />
    <meta name="twitter:image" content="" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <!-- Header / Navigation -->
    <header class="header">
      <div class="header__inner">
        <a href="/" class="header__logo">
          <span class="header__logo-icon">📅</span>
          <span>Today in History</span>
        </a>
        <nav class="header__nav">
          <a href="/" class="header__nav-link header__nav-link--active">Home</a>
          <a href="/favorites.html" class="header__favorites header__nav-link">
            <span>♥</span>
            <span class="header__favorites-count" id="favorites-count"></span>
            <span class="hide-mobile">Favorites</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <!-- Section 1: Hero Event -->
      <section class="section" id="hero-section">
        <div id="hero-container">
          <div class="skeleton skeleton--image"></div>
          <div class="skeleton skeleton--heading"></div>
          <div class="skeleton skeleton--text"></div>
          <div class="skeleton skeleton--text skeleton--text-short"></div>
        </div>
      </section>

      <!-- Section 2: Timeline (Top 20 Events) -->
      <section class="section" id="timeline-section">
        <h2 class="section__title">More Events Today</h2>
        <div class="event-cards-grid" id="timeline-container">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </section>

      <!-- Section 3: Niche Cards Grid -->
      <section class="section" id="niches-section">
        <h2 class="section__title">Explore by Your Passion</h2>
        <p class="section__subtitle">Choose a niche and discover what happened today.</p>
        <div class="niche-grid" id="niche-grid-container">
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
          <div class="skeleton skeleton--card"></div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__inner">
        <div class="footer__brand">📅 Today in History</div>
        <p class="footer__text">Explore the past through your passions. A new story every day.</p>
        <p class="footer__bottom">&copy; 2026 Today in History. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
